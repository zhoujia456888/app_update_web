services:
  app_update_web:
    container_name: app_update_web
    image: app_update_web:latest
    build:
      context: .
      dockerfile: Dockerfile
    # 每次 up 都触发构建：源码未变化时命中 Docker 层缓存秒过，源码变化时自动重新构建
    pull_policy: build
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 5802
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://app_update_service:5800}
    ports:
      - "5802:5802"
    networks:
      - app_update_net
    restart: unless-stopped
    init: true

networks:
  app_update_net:
    external: true
    name: ${APP_UPDATE_DOCKER_NETWORK:-app_update_net}